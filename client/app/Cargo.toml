[package]
name = "lightnote_app"
version = "1.1.0"
edition = "2021"
description = "LightNote Tauri desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
lightnote_core = { path = "../src-tauri" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"

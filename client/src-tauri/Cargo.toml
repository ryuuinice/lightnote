[package]
name = "lightnote_core"
version = "0.1.0"
edition = "2021"
description = "LightNote client Rust core: SQLite local store, change log, outbox, cursor, FTS5, sync engine"

[lib]
name = "lightnote_core"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

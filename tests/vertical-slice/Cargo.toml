[package]
name = "lightnote-slice"
version = "0.1.0"
edition = "2021"
description = "LightNote vertical slice integration tests: real Go server process + two real client cores"

[lib]
name = "lightnote_slice"
path = "src/lib.rs"

[dependencies]
lightnote_core = { path = "../../client/src-tauri" }
serde_json = "1.0.151"
tempfile = "3.27.0"
ureq = { version = "2.12.1", features = ["json"] }
